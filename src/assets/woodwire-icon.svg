<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Expanded canopy mask: keeps branches close to the squircle edges -->
    <clipPath id="canopy-clip">
      <circle cx="256" cy="230" r="216" />
    </clipPath>
    
    <style>
      /* Deep Forest Slate: A rich, dark woodland charcoal-teal for the squircle backing.
         The 4 outer canvas corners outside this rounded rect remain 100% transparent! */
      .bg { fill: #1B2A24; }
      
      /* Warm Oak Brown: A richer, slightly darker timber tone for the trunk and wires */
      .trace {
        stroke: #AD7043;
        stroke-width: 17;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        stroke-miterlimit: 4;
        fill: none;
      }
      
      /* Woodland Emerald: A deeper, lush leaf-green that still pops crisply */
      .node { fill: #2BA85C; }
    </style>
  </defs>

  <!-- Solid Squircle Background (leaves the 512x512 outer corners transparent) -->
  <rect class="bg" width="512" height="512" rx="115" ry="115" />

  <!-- Central Trunk -->
  <path class="trace" d="M 256 485 L 256 240" />

  <!-- Masked Canopy Structure (Octilinear 0, 45, and 90 degree routing) -->
  <g clip-path="url(#canopy-clip)">
    <!-- Central Rhombus / Diamond -->
    <path class="trace" d="M 256 240 L 166 150 L 256 60 L 346 150 Z" />

    <!-- Top and Upper-Diagonal Branches -->
    <path class="trace" d="M 256 60 L 256 0" />
    <path class="trace" d="M 216 100 L 96 -20" />
    <path class="trace" d="M 296 100 L 416 -20" />

    <!-- Left Canopy Network -->
    <path class="trace" d="M 166 150 L 136 120 L 0 120" />
    <path class="trace" d="M 136 120 L 16 0" />
    <path class="trace" d="M 166 150 L 86 230 L 0 230" />
    <path class="trace" d="M 86 230 L 0 316" />
    <path class="trace" d="M 86 230 L 146 290 L 256 290" />
    <path class="trace" d="M 256 290 L 210 336 L 210 460" />
    <path class="trace" d="M 210 336 L 130 336 L 40 426" />
    <path class="trace" d="M 130 336 L 90 376 L 0 376" />

    <!-- Right Canopy Network -->
    <path class="trace" d="M 346 150 L 376 120 L 512 120" />
    <path class="trace" d="M 376 120 L 496 0" />
    <path class="trace" d="M 346 150 L 426 230 L 512 230" />
    <path class="trace" d="M 426 230 L 512 316" />
    <path class="trace" d="M 426 230 L 366 290 L 256 290" />
    <path class="trace" d="M 256 290 L 302 336 L 302 460" />
    <path class="trace" d="M 302 336 L 382 336 L 472 426" />
    <path class="trace" d="M 382 336 L 422 376 L 512 376" />
  </g>

  <!-- Circuit Junction Nodes (Solder Pads / Leaves) -->
  <g class="node">
    <!-- Primary Diamond Nodes -->
    <circle cx="256" cy="240" r="16.5" />
    <circle cx="166" cy="150" r="16.5" />
    <circle cx="346" cy="150" r="16.5" />
    
    <!-- Outer and Lower Branch Nodes -->
    <circle cx="86" cy="230" r="16.5" />
    <circle cx="426" cy="230" r="16.5" />
    <circle cx="130" cy="336" r="16.5" />
    <circle cx="382" cy="336" r="16.5" />
  </g>
</svg>
