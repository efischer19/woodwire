name: Deploy to AWS (S3 + Cloudflare Purge)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to S3 and purge Cloudflare cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DeployAWS-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Optional build step (for frameworks or bundlers):
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - name: Install dependencies
      #   run: <package-manager> install
      # - name: Build site
      #   run: <package-manager> run build
      # Then update the S3 sync source path below (e.g., dist/ instead of src/).

      - name: Sync site to S3
        run: |
          echo "🚀 Syncing site to s3://${{ vars.S3_BUCKET_NAME }}/"

          aws s3 sync src/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=3600"
          # Tip: adjust --cache-control per file type (e.g. shorter TTL for HTML,
          # longer for versioned assets). See AWS S3 sync docs for --include/--exclude.

          echo "✅ Site synced successfully"

      - name: Verify Cloudflare purge credentials
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "❌ Missing required Cloudflare credentials"
            exit 1
          fi

      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "🔄 Purging Cloudflare cache for zone: $CF_ZONE_ID"

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_status=$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CF_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything": true}')

          python - "$http_status" "$response_file" <<'PY'
          import json
          import pathlib
          import sys

          http_status = int(sys.argv[1])
          response_path = pathlib.Path(sys.argv[2])
          raw_response = response_path.read_text()

          try:
              payload = json.loads(raw_response)
          except json.JSONDecodeError:
              print(
                  f"Cloudflare cache purge failed (invalid JSON response, status={http_status}).",
                  file=sys.stderr,
              )
              print(raw_response, file=sys.stderr)
              sys.exit(1)

          if http_status >= 400 or not payload.get("success"):
              failure_kind = "HTTP error" if http_status >= 400 else "Cloudflare API error"
              print(
                  f"Cloudflare cache purge failed ({failure_kind}, status={http_status}).",
                  file=sys.stderr,
              )
              print(json.dumps(payload, indent=2), file=sys.stderr)
              sys.exit(1)

          print("✅ Cloudflare cache purged successfully")
          PY

      - name: Deployment summary
        if: always()
        run: |
          echo "## AWS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :---- | :---- |" >> $GITHUB_STEP_SUMMARY
          echo "| Bucket | \`s3://${{ vars.S3_BUCKET_NAME }}/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
